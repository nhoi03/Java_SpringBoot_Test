
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Employee Details</h3>
        </div>

        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4">ID</dt>
                <dd class="col-sm-8" th:text="${employee.id}"></dd>

                <dt class="col-sm-4">Employee Code</dt>
                <dd class="col-sm-8"
                    th:text="${employee.employeeCode}"></dd>

                <dt class="col-sm-4">Full Name</dt>
                <dd class="col-sm-8" th:text="${employee.fullName}"></dd>

                <dt class="col-sm-4">Email</dt>
                <dd class="col-sm-8" th:text="${employee.email}"></dd>

                <dt class="col-sm-4">Phone</dt>
                <dd class="col-sm-8" th:text="${employee.phone}"></dd>

                <dt class="col-sm-4">Position</dt>
                <dd class="col-sm-8" th:text="${employee.position}"></dd>

                <dt class="col-sm-4">Salary</dt>
                <dd class="col-sm-8"
                    th:text="${#numbers.formatDecimal(employee.salary, 1, 2)}"></dd>

                <dt class="col-sm-4">Hire Date</dt>
                <dd class="col-sm-8" th:text="${employee.hireDate}"></dd>
            </dl>

            <div class="d-flex gap-2">
                <a class="btn btn-warning"
                   th:href="@{/employees/{id}/edit(id=${employee.id})}">
                    Edit
                </a>
                <a class="btn btn-secondary" th:href="@{/employees}">
                    Back to List
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
