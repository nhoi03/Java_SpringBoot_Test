
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 760px">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:text="${pageTitle}">Employee Form</h3>
        </div>

        <div class="card-body">
            <form th:object="${employee}"
                  th:action="${formAction}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Employee Code</label>
                    <input type="text" th:field="*{employeeCode}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('employeeCode')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{employeeCode}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Position</label>
                    <input type="text" th:field="*{position}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('position')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{position}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number" step="0.01" min="0.01"
                           th:field="*{salary}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{salary}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hire Date</label>
                    <input type="date" th:field="*{hireDate}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('hireDate')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:errors="*{hireDate}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        Save
                    </button>
                    <a th:href="@{/employees}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
