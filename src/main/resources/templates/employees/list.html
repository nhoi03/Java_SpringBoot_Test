
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/employees}">
            IASF - Employee Management
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employee List</h2>
        <a class="btn btn-success" th:href="@{/employees/new}">
            + Add Employee
        </a>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <form th:action="@{/employees}" method="get"
          class="row g-2 mb-3">
        <div class="col-md-9">
            <input type="text" name="keyword"
                   class="form-control"
                   placeholder="Search by name or employee code"
                   th:value="${keyword}">
        </div>
        <div class="col-md-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">
                Search
            </button>
            <a class="btn btn-secondary" th:href="@{/employees}">
                Reset
            </a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Position</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.employeeCode}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.position}"></td>
                    <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}"></td>
                    <td>
                        <div class="d-flex gap-1">
                            <a class="btn btn-info btn-sm text-white"
                               th:href="@{/employees/{id}(id=${emp.id})}">
                                View
                            </a>

                            <a class="btn btn-warning btn-sm"
                               th:href="@{/employees/{id}/edit(id=${emp.id})}">
                                Edit
                            </a>

                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this employee?')">
                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="text-center py-4">
                        No employees found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted mt-3">
        Total employees:
        <strong th:text="${#lists.size(employees)}"></strong>
    </p>
</div>

</body>
</html>
